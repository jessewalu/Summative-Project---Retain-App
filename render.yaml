# Render blueprint: PostgreSQL database + the API.
# The React frontend is hosted separately on Vercel (see README), so it is not listed here.
# New > Blueprint on Render, point it at this repo, then fill in the two values marked "sync: false".
databases:
  - name: retain-db
    plan: free
    databaseName: retain

services:
  - type: web
    name: retain-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: retain-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # the Vercel site, e.g. https://retain-ruddy.vercel.app (no trailing slash, no path)
      - key: ADMIN_PASSWORD
        sync: false # pick your own, do not keep the development default
