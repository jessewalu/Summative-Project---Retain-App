# Render blueprint: database + API + static frontend.
# New > Blueprint on Render, point it at this repo, then fill in the two values marked "sync: false".
databases:
  - name: retain-db
    plan: free
    databaseName: retain

services:
  - type: web
    name: retain-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: retain-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # the frontend URL, e.g. https://retain-web.onrender.com
      - key: ADMIN_PASSWORD
        sync: false # pick your own, do not keep the development default

  - type: web
    name: retain-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # the API URL plus /api, e.g. https://retain-api.onrender.com/api
    routes:
      # Lets React Router handle deep links like /expenses on a refresh.
      - type: rewrite
        source: /*
        destination: /index.html
